<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emilija — Portfolio</title>

    <link rel="icon" type="image/x-icon" href="./images/Logo.png">
    <link rel="preload" as="image" href="./images/background_with_logo.png" fetchpriority="high">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">


    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">

    <!-- Main CSS -->
    <link rel="stylesheet" href="./styles/main.css">

    <!--Lucide -->
    <script defer src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

    <!-- HEADER -->
    <header>
        <nav>
            <a href="./index.html">
                <img src="./images/Logo.png" alt="Logo Emilija" class="logo">
            </a>
            <ul>
                <li><a href="#about">About</a></li>
                <li><a href="#work">Work</a></li>
                <li><a href="#skills">Skills</a></li>
                <li><a href="#education">Education</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- HERO -->
    <section class="hero">
        <div class="hero-content">
            <h1>Hello World, I’m Emilija</h1>

            <div class="typing">
                <span id="typing"></span>
            </div>

            <a href="#work" class="view_my_work">View My Work →</a>
        </div>

        <div class="tagline">
            <p>VISUALIZE</p>
            <p>·</p>
            <p>ENGINEER</p>
            <p>·</p>
            <p>DELIVER</p>
        </div>
    </section>

    <!-- INJECTED SECTIONS -->
    <div id="about"></div>
    <div id="work"></div>
    <div id="skills"></div>
    <div id="education"></div>
    <div id="contact"></div>

    <!-- Typed.js -->
    <script src="https://unpkg.com/typed.js@3.0.0/dist/typed.umd.js"></script>

    <script>
        /*  Helper Functions */

        function loadSection(id, url, after) {
            return fetch(url)
                .then(r => r.text())
                .then(html => {
                    document.getElementById(id).innerHTML = html;

                    // Re-render Lucide icons for any injected section
                    if (window.lucide) lucide.createIcons();

                    // Optional callback (e.g. Swiper init)
                    if (typeof after === "function") after();
                })
                .catch(err => console.error(`Failed to load ${url}`, err));
        }

        function loadScriptOnce(src) {
            return new Promise((resolve, reject) => {
                if (document.querySelector(`script[src="${src}"]`)) return resolve();
                const s = document.createElement("script");
                s.src = src;
                s.onload = resolve;
                s.onerror = reject;
                document.body.appendChild(s);
            });
        }

        /* Load Sections */

        loadSection("about", "./pages/about.html");

        loadSection("skills", "./pages/skills.html");

        loadSection("education", "./pages/education.html");

        loadSection("contact", "./pages/contact.html");

        loadSection("work", "./pages/work.html", async () => {

            await loadScriptOnce("https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js");

            const workSwiperEl = document.querySelector(".work-swiper");
            if (!workSwiperEl) return;

            new Swiper(workSwiperEl, {
                effect: "coverflow",
                slidesPerView: 3,
                centeredSlides: true,
                loop: false,
                grabCursor: true,
                slideToClickedSlide: true,
                preventClicks: false,
                preventClicksPropagation: false,
                speed: 850,
                coverflowEffect: {
                    rotate: 28,
                    depth: 240,
                    modifier: 1,
                    stretch: 0,
                    slideShadows: false
                },
                pagination: {
                    el: workSwiperEl.querySelector(".swiper-pagination"),
                    clickable: true
                },
                navigation: {
                    nextEl: workSwiperEl.querySelector(".swiper-button-next"),
                    prevEl: workSwiperEl.querySelector(".swiper-button-prev")
                }
            });

        });

        /* Typed Hero Effect */

        new Typed("#typing", {
            strings: ["Scrum Master", "Full-stack Developer", "Graphic Engineer"],
            typeSpeed: 50,
            backSpeed: 70,
            loop: true,
            cursorChar: "|",
        });

    </script>

</body>

</html>
