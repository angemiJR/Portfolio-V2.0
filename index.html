<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emilija — Portfolio</title>
    <link rel="icon" type="image/x-icon" href="./images/Logo.png">
    <link rel="preload" as="image" href="./images/background_with_logo.png" fetchpriority="high">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="preload" as="style"
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap"
        media="print" onload="this.media='all'">

    <link rel="preload" as="style"
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
        media="print" onload="this.media='all'">

    <noscript>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
    </noscript>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">

    <!--CSS -->

    <link rel="stylesheet" href="./styles/main.css">


</head>

<body>
    <header>
        <nav>
            <a href="./index.html">
                <img src="./images/Logo.png" alt="Logo_Emilija" class="logo">
            </a>
            <ul>
                <li><a href="#about">About</a></li>
                <li><a href="#work">Work</a></li>
                <li><a href="#skills">Skills</a></li>
                <li><a href="#education">Education</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h1>Hello World, I’m Emilija</h1>


            <div class="typing">
                <span id="typing"></span>
            </div>

            <a href="#work" class="view_my_work">View My Work →</a>
        </div>

        <div class="tagline">
            <p>VISUALIZE</p>
            <p>·</p>
            <p>ENGINEER</p>
            <p>·</p>
            <p>DELIVER</p>
        </div>
    </section>


    <div id="about"></div>

    <script>
        fetch("./pages/about.html")
            .then(r => r.text())
            .then(html => {
                document.getElementById("about").innerHTML = html;
            });
    </script>

    <div id="work"></div>

    <script>
        // 1) Load work.html
        fetch("./pages/work.html")
            .then(r => r.text())
            .then(async (html) => {
                document.getElementById("work").innerHTML = html;

                // 2) Load Swiper JS (only once)
                await loadScriptOnce("https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js");

                // 3) Init Swiper after the DOM exists
                const workSwiperEl = document.querySelector(".work-swiper");
                if (!workSwiperEl) return;

                new Swiper(workSwiperEl, {
                    effect: "coverflow",
                    slidesPerView: 3,
                    centeredSlides: true,
                    loop: false,
                    grabCursor: true,

                    // ✅ THIS makes left/right slide come to front on click
                    slideToClickedSlide: true,

                    // ✅ prevent Swiper from blocking clicks
                    preventClicks: false,
                    preventClicksPropagation: false,
                    speed: 850,

                    coverflowEffect: {
                        rotate: 28,
                        depth: 240,
                        modifier: 1,
                        stretch: 0,
                        slideShadows: false
                    },

                    pagination: {
                        el: workSwiperEl.querySelector(".swiper-pagination"),
                        clickable: true
                    },
                    navigation: {
                        nextEl: workSwiperEl.querySelector(".swiper-button-next"),
                        prevEl: workSwiperEl.querySelector(".swiper-button-prev")
                    }
                });



            });

        function loadScriptOnce(src) {
            return new Promise((resolve, reject) => {
                if (document.querySelector(`script[src="${src}"]`)) return resolve();
                const s = document.createElement("script");
                s.src = src;
                s.onload = resolve;
                s.onerror = reject;
                document.body.appendChild(s);
            });
        }
    </script>


    <div id="skills"></div>

    <script>
        fetch("./pages/skills.html")
            .then(r => r.text())
            .then(html => {
                document.getElementById("skills").innerHTML = html;
            });
    </script>

     <div id="education"></div>

    <script>
        fetch("./pages/education.html")
            .then(r => r.text())
            .then(html => {
                document.getElementById("education").innerHTML = html;
            });
    </script>


    <script src="https://unpkg.com/typed.js@3.0.0/dist/typed.umd.js"></script>
    <script>
        var typed = new Typed("#typing",
            {
                strings: ["Scrum Master", "Full-stack Developer", "Graphic Engineer"],
                typeSpeed: 50,
                backSpeed: 70,
                loop: true,
                cursorChar: '|',
            })
    </script>
</body>

</html>
