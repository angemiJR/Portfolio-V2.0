<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emilija — Portfolio</title>

    <link rel="icon" type="image/x-icon" href="./images/Logo.png">
    <link rel="preload" as="image" href="./images/background_with_logo.png" fetchpriority="high">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Glide CSS (replaces Swiper CSS) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@glidejs/glide/dist/css/glide.core.min.css">

    <!-- Main CSS -->
    <link rel="stylesheet" href="./styles/main.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <nav>
            <a href="./index.html" class="brand">
                <img src="./images/Logo.png" alt="Logo Emilija" class="logo">
            </a>

            <button class="nav-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="nav-menu">
                <span class="nav-toggle-bar"></span>
                <span class="nav-toggle-bar"></span>
                <span class="nav-toggle-bar"></span>
            </button>

            <ul id="nav-menu">
                <li><a href="#about">About</a></li>
                <li><a href="#work">Work</a></li>
                <li><a href="#skills">Skills</a></li>
                <li><a href="#education">Education</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- HERO -->
    <section class="hero">
        <div class="hero-content">
            <h1>Hello World, I’m Emilija</h1>

            <div class="typing">
                <span id="typing"></span>
            </div>

            <a href="#work" class="view_my_work">View My Work →</a>
        </div>

        <div class="tagline">
            <p>VISUALIZE</p>
            <p>·</p>
            <p>ENGINEER</p>
            <p>·</p>
            <p>DELIVER</p>
        </div>
    </section>

    <!-- INJECTED SECTIONS -->
    <div id="about"></div>
    <div id="work"></div>
    <div id="skills"></div>
    <div id="education"></div>
    <div id="contact"></div>

    <!-- Typed.js -->
    <script src="https://unpkg.com/typed.js@3.0.0/dist/typed.umd.js"></script>

    <!-- Glide JS (replaces Swiper JS) -->
    <script src="https://cdn.jsdelivr.net/npm/@glidejs/glide"></script>

    <script>
        // Mobile nav toggle
        const toggle = () => {
            const btn = document.querySelector(".nav-toggle");
            const menu = document.querySelector("#nav-menu");
            const isOpen = menu.classList.toggle("is-open");
            btn.setAttribute("aria-expanded", String(isOpen));
        };

        window.addEventListener("DOMContentLoaded", () => {
            const btn = document.querySelector(".nav-toggle");
            const menu = document.querySelector("#nav-menu");

            if (!btn || !menu) return;

            btn.addEventListener("click", toggle);

            // Close menu after clicking a link
            menu.addEventListener("click", (e) => {
                const link = e.target.closest("a");
                if (!link) return;
                menu.classList.remove("is-open");
                btn.setAttribute("aria-expanded", "false");
            });

            // Close on Escape
            document.addEventListener("keydown", (e) => {
                if (e.key !== "Escape") return;
                menu.classList.remove("is-open");
                btn.setAttribute("aria-expanded", "false");
            });
        });
    </script>

    <script>
        /* Helper Functions */

        function loadSection(id, url, after) {
            return fetch(url)
                .then(r => r.text())
                .then(html => {
                    document.getElementById(id).innerHTML = html;
                    if (typeof after === "function") after();
                })
                .catch(err => console.error(`Failed to load ${url}`, err));
        }

        /* Work: build bullets for Glide (so you don’t hardcode them) */
        function buildGlideBullets(glideRoot) {
            const slides = glideRoot.querySelectorAll(".glide__slide");
            const bullets = glideRoot.querySelector(".glide__bullets");
            if (!bullets) return;

            bullets.innerHTML = "";
            slides.forEach((_, i) => {
                const b = document.createElement("button");
                b.className = "glide__bullet";
                b.type = "button";
                b.setAttribute("data-glide-dir", `=${i}`);
                bullets.appendChild(b);
            });
        }

        /* Load Sections */

        loadSection("about", "./pages/about.html");
        loadSection("skills", "./pages/skills.html");
        loadSection("education", "./pages/education.html");
        loadSection("contact", "./pages/contact.html");

        loadSection("work", "./pages/work.html", () => {
            const glideRoot = document.querySelector(".work-glide");
            if (!glideRoot) return;

            buildGlideBullets(glideRoot);

            new Glide(glideRoot, {
                type: "carousel",
                perView: 3,
                focusAt: 1,
                gap: 10,
                animationDuration: 850,

                rewind: false,
                breakpoints: {
                    1023: { perView: 2 },
                    820: { perView: 1 }
                }
            }).mount();
        });

        document.addEventListener("submit", async function (e) {

            const form = e.target.closest(".contact_form");
            if (!form) return;

            e.preventDefault();

            const status = form.querySelector(".form-status");
            const button = form.querySelector(".send-btn");

            status.textContent = "Sending...";
            button.disabled = true;

            try {
                const response = await fetch(form.action, {
                    method: "POST",
                    body: new FormData(form),
                    headers: { "Accept": "application/json" }
                });

                if (response.ok) {
                    form.reset();
                    status.textContent = "✅ Thanks! Your message has been sent.";
                } else {
                    status.textContent = "❌ Something went wrong. Please try again.";
                }

            } catch (error) {
                status.textContent = "❌ Network error. Please try again.";
            }

            button.disabled = false;

        });


        /* Typed Hero Effect */
        new Typed("#typing", {
            strings: ["Scrum Master", "Full-stack Developer", "Graphic Engineer"],
            typeSpeed: 50,
            backSpeed: 70,
            loop: true,
            cursorChar: "|",
        });
    </script>

</body>

</html>
